[project]
name = "desafio-junior"
version = "0.1.0"
description = "Mini API de Ocorrências de Veículo - desafio técnico Junior"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
